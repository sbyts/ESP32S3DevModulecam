[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Налаштування флеш-пам'яті та PSRAM для чіпа N16R8
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.prg_flash_size = 16MB

build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Критичні прапорці для активації та використання 8MB PSRAM через malloc
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_MODE_OCT=1
    -D CONFIG_SPIRAM_SPEED_120M=1
    -D CONFIG_SPIRAM_BOOT_INIT=1
    -D CONFIG_SPIRAM_USE_MALLOC=1

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9